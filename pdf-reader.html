<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Textbook reader</title><style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#e2e8f0;color:#1e293b}header{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:center;gap:12px;padding:10px;background:#f8fafcf2;border-bottom:1px solid #cbd5e1}button,input{font:inherit;border:1px solid #cbd5e1;border-radius:7px;padding:7px;background:white;color:#334155}input{width:64px}#document{padding:18px;display:grid;justify-items:center;gap:14px}canvas{max-width:100%;height:auto;box-shadow:0 3px 16px #33415530;background:white}#status{text-align:center;padding:20px}a{color:#4338ca}button:disabled{opacity:.4}</style></head><body><header aria-label="PDF controls"><button id="previous" aria-label="Previous page">←</button><label>Page <input id="page" type="number" min="1" value="1" aria-label="PDF page"></label><span id="total">/ —</span><button id="next" aria-label="Next page">→</button><button id="zoom" aria-label="Toggle zoom">Zoom</button></header><p id="status" role="status">Loading textbook…</p><main id="document"><canvas id="canvas" aria-label="Textbook page"></canvas></main><script type="module" src="js/pdf-reader.mjs?release=education-compact-header"></script></body></html>
